name: release
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-solarmicrobe.[0-9]+"
permissions:
  contents: write
  packages: write
jobs:
  release:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: ./.github/actions/release
      with:
        tag: ${{ github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: dispatch homebrew tap update
      if: contains(github.ref_name, '-solarmicrobe.')
      env:
        HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        RELEASE_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        if [ -z "${HOMEBREW_TAP_DISPATCH_TOKEN}" ]; then
          echo "::error::HOMEBREW_TAP_DISPATCH_TOKEN is required to update solarmicrobe/homebrew-tap"
          exit 1
        fi

        curl -fsSL -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${HOMEBREW_TAP_DISPATCH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          https://api.github.com/repos/solarmicrobe/homebrew-tap/dispatches \
          -d "{\"event_type\":\"ghq_release\",\"client_payload\":{\"tag\":\"${RELEASE_TAG}\",\"sha\":\"${RELEASE_SHA}\",\"repository\":\"${GITHUB_REPOSITORY}\"}}"
